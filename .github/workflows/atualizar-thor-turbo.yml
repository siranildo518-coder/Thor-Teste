name: Atualizar resultados Thor Turbo
on:
  schedule:
    - cron: '0 * * * *' # Buscar na hora cheia (UTC e Brasilia compartilham minuto 00)
    - cron: '5-55/5 * * * *' # Repetir a cada 5 minutos ate o resultado ser publicado
  push:
    branches: [main]
    paths:
      - 'thor-turbo/coleta-direta.py'
      - 'thor-turbo/pedido-coleta.txt'
      - 'thor-turbo/matriz-firefox-remoto.py'
      - '.github/workflows/atualizar-thor-turbo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thor-turbo-resultados
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Coletar pela API diretamente
        id: direta
        continue-on-error: true
        env:
          LB_USER: ${{ secrets.LOTOBANCA_LOGIN }}
          LB_PASS: ${{ secrets.LOTOBANCA_SENHA }}
        run: python3 thor-turbo/coleta-direta.py
      - name: Verificar pedidos do botão Atualizar
        id: sinal
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=alerta-matriz-v1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf 'Tor Turbo\n' > "$RUNNER_TEMP/atualizar.txt"
            gh release create "$tag" "$RUNNER_TEMP/atualizar.txt" --prerelease --latest=false --target "$GITHUB_SHA" --title "Sinal do botão Atualizar" --notes "Pedidos de consulta da Matriz no Firefox remoto."
          fi
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag?v=$GITHUB_RUN_ID" --jq '.assets[] | select(.name=="atualizar.txt") | .download_count')
          [[ "$count" =~ ^[0-9]+$ ]]
          last=0
          if test -f thor-turbo/alerta-matriz.json; then last=$(jq -er .atendidos thor-turbo/alerta-matriz.json); fi
          echo "Pedidos registrados: $count; atendidos: $last"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if (( count > last )); then echo "pendente=true" >> "$GITHUB_OUTPUT"; fi
      - name: Consultar Matriz no Firefox do GitHub
        id: firefox
        continue-on-error: true
        timeout-minutes: 8
        env:
          LOTOBANCA_LOGIN: ${{ secrets.LOTOBANCA_LOGIN }}
          LOTOBANCA_SENHA: ${{ secrets.LOTOBANCA_SENHA }}
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install firefox
          set -o pipefail
          python3 thor-turbo/matriz-firefox-remoto.py | tee "$RUNNER_TEMP/matriz.log"
          grep -q 'Leitura confirmada: SIM' "$RUNNER_TEMP/matriz.log"
      - name: Registrar atendimento após conferir a API
        if: steps.sinal.outputs.pendente == 'true'
        env:
          COUNT: ${{ steps.sinal.outputs.count }}
          FIREFOX: ${{ steps.firefox.outcome }}
        run: |
          jq -n --argjson n "$COUNT" --arg f "$FIREFOX" --arg t "$(date -u +%FT%TZ)" '{atendidos:$n,firefox:$f,conferidoEm:$t}' > thor-turbo/alerta-matriz.json
          git add thor-turbo/alerta-matriz.json
      - name: Mostrar diagnostico da coleta automatica
        if: always()
        env:
          DIRETA: ${{ steps.direta.outcome }}
          FIREFOX: ${{ steps.firefox.outcome }}
        run: |
          echo "Resultado API direta: $DIRETA"
          echo "Resultado Firefox remoto: $FIREFOX"
          if [[ "$DIRETA" != "success" && "$FIREFOX" != "success" ]]; then
            echo "::warning::API e Firefox falharam; a coleta nao foi confirmada."
          fi
      - name: Publicar resultados coletados pelo Firefox ou API
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thor-turbo/resultados.json thor-turbo/alerta-matriz.json
          if git diff --cached --quiet; then
            echo "Nenhum resultado novo encontrado nas fontes consultadas"
            exit 0
          fi
          git commit -m "Thor Turbo: publicar coleta automatica do Firefox e API"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "::error::Nao foi possivel publicar a coleta no GitHub"
          exit 1
