name: Atualizar resultados Thor Turbo
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thor-turbo-resultados
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Consultar API Lotobanca e preservar base
        env:
          LOTO_TURBO_COOKIE: ${{ secrets.LOTO_TURBO_COOKIE }}
        run: python3 thor-turbo/atualizar_resultados.py
      - name: Publicar apenas quando houver resultados novos
        run: |
          if ! git diff --quiet -- thor-turbo/resultados.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add thor-turbo/resultados.json
            git commit -m "Thor Turbo: atualizar resultados automaticamente"
            git push
          fi
