name: Atualizar resultados Thor Turbo
on:
  schedule:
    - cron: '0 * * * *' # Buscar na hora cheia (UTC e Brasilia compartilham minuto 00)
    - cron: '5-55/5 * * * *' # Repetir a cada 5 minutos ate o resultado ser publicado
  push:
    branches: [main]
    paths:
      - 'thor-turbo/coleta-direta.py'
      - 'thor-turbo/pedido-coleta.txt'
      - 'thor-turbo/matriz-chromium-remoto.py'
      - '.github/workflows/atualizar-thor-turbo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thor-turbo-resultados
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Acionar alerta automatico sem abrir o aplicativo
        run: |
          echo "ALERTA AUTOMATICO THOR TURBO"
          echo "Acionado pelo GitHub Actions, independente do app e do botao Enviar."
          echo "Horario UTC: $(date -u +%FT%TZ)"
          echo "Evento: ${{ github.event_name }}"
          echo "Iniciando consulta dos sorteios publicados na Lotobanca."
      - name: Coletar pela API diretamente
        id: direta
        continue-on-error: true
        env:
          LB_USER: ${{ secrets.LOTOBANCA_LOGIN }}
          LB_PASS: ${{ secrets.LOTOBANCA_SENHA }}
        run: python3 thor-turbo/coleta-direta.py
      - name: Verificar pedidos do botão Atualizar
        id: sinal
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=alerta-matriz-v1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf 'Tor Turbo\n' > "$RUNNER_TEMP/atualizar.txt"
            gh release create "$tag" "$RUNNER_TEMP/atualizar.txt" --prerelease --latest=false --target "$GITHUB_SHA" --title "Sinal do botão Atualizar" --notes "Pedidos de consulta da Matriz no Chromium remoto."
          fi
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag?v=$GITHUB_RUN_ID" --jq '.assets[] | select(.name=="atualizar.txt") | .download_count')
          [[ "$count" =~ ^[0-9]+$ ]]
          last=0
          if test -f thor-turbo/alerta-matriz.json; then last=$(jq -er .atendidos thor-turbo/alerta-matriz.json); fi
          echo "Pedidos registrados: $count; atendidos: $last"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if (( count > last )); then echo "pendente=true" >> "$GITHUB_OUTPUT"; fi
      - name: Consultar Matriz no Chromium do GitHub
        id: chromium
        continue-on-error: true
        timeout-minutes: 8
        env:
          LOTOBANCA_LOGIN: ${{ secrets.LOTOBANCA_LOGIN }}
          LOTOBANCA_SENHA: ${{ secrets.LOTOBANCA_SENHA }}
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
          set -o pipefail
          python3 thor-turbo/matriz-chromium-remoto.py | tee "$RUNNER_TEMP/matriz.log"
          grep -q 'Leitura confirmada: SIM' "$RUNNER_TEMP/matriz.log"
      - name: Registrar atendimento após conferir a API
        if: steps.sinal.outputs.pendente == 'true'
        env:
          COUNT: ${{ steps.sinal.outputs.count }}
          FIREFOX: ${{ steps.chromium.outcome }}
        run: |
          jq -n --argjson n "$COUNT" --arg f "$FIREFOX" --arg t "$(date -u +%FT%TZ)" '{atendidos:$n,chromium:$f,conferidoEm:$t}' > thor-turbo/alerta-matriz.json
          git add thor-turbo/alerta-matriz.json
      - name: Mostrar diagnostico da coleta automatica
        if: always()
        env:
          DIRETA: ${{ steps.direta.outcome }}
          FIREFOX: ${{ steps.chromium.outcome }}
        run: |
          echo "Resultado API direta: $DIRETA"
          echo "Resultado Chromium remoto: $FIREFOX"
          if [[ "$DIRETA" != "success" && "$FIREFOX" != "success" ]]; then
            echo "::warning::API e Chromium falharam; a coleta nao foi confirmada."
          fi
      - name: Exigir coleta confirmada antes de considerar execucao concluida
        if: always()
        env:
          DIRETA: ${{ steps.direta.outcome }}
          FIREFOX: ${{ steps.chromium.outcome }}
        run: |
          set -euo pipefail
          if [[ "$DIRETA" != "success" && "$FIREFOX" != "success" ]]; then
            echo "::error::FALHA REAL: nem API direta nem Chromium remoto confirmaram resultados. Verifique credenciais LOTOBANCA_LOGIN/LOTOBANCA_SENHA e logs das etapas."
            exit 1
          fi
          echo "Consulta executada; atualidade dos resultados sera validada no final."
      - name: Publicar resultados coletados pelo Chromium ou API
        if: steps.direta.outcome == 'success' || steps.chromium.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thor-turbo/resultados.json thor-turbo/alerta-matriz.json
          if git diff --cached --quiet; then
            echo "Nenhum resultado novo encontrado nas fontes consultadas"
            exit 0
          fi
          git commit -m "Thor Turbo: publicar coleta automatica do Chromium e API"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "::error::Nao foi possivel publicar a coleta no GitHub"
          exit 1

      - name: Reprovar resultados atrasados mesmo com API HTTP 200
        if: always() && (steps.direta.outcome == 'success' || steps.chromium.outcome == 'success')
        run: |
          python3 - <<'PY'
          import json, datetime, sys
          from zoneinfo import ZoneInfo
          with open('thor-turbo/resultados.json', encoding='utf-8') as f:
              records=json.load(f).get('records', [])
          now=datetime.datetime.now(ZoneInfo('America/Sao_Paulo'))
          # O ultimo horario de sorteio esperado e a hora cheia, com tolerancia de 5 minutos.
          target=now.replace(minute=0, second=0, microsecond=0)
          if now.minute < 5:
              target-=datetime.timedelta(hours=1)
          dates=[]
          for r in records:
              try:
                  d=datetime.datetime.fromisoformat(str(r['scheduledAt']).replace('Z','+00:00')).astimezone(ZoneInfo('America/Sao_Paulo'))
                  dates.append(d)
              except (KeyError,ValueError,TypeError):
                  pass
          latest=max(dates) if dates else None
          print('Hora esperada (Brasilia):',target.isoformat())
          print('Ultimo resultado no JSON:',latest.isoformat() if latest else 'nenhum')
          if latest is None or latest < target:
              print('::error::RESULTADO ATRASADO: coleta executou mas nao publicou concurso da hora esperada')
              sys.exit(1)
          print('Resultado da hora confirmado no JSON')
          PY
