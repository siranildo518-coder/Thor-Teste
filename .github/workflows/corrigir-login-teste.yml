name: Corrigir login THOR TESTE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/corrigir-login-teste.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Liberar login exclusivo de teste
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = "const resultado = await verificarTravaAparelho(hash);"
          new = "// Conta exclusiva do THOR TESTE: não depende da trava do app oficial.\n      const resultado = hash === 'oxvhil' ? {ok:true} : await verificarTravaAparelho(hash);"
          for name in ("app-main.html", "app-direct.html"):
              p = Path(name)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"Ponto de login não encontrado em {name}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-main.html app-direct.html
          git commit -m "Corrige login da conta exclusiva de teste"
          git push origin main
