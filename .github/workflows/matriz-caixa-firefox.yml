name: Caixa Lotobanca — Firefox virtual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'caixa/matriz-firefox-remoto.py'
      - '.github/workflows/matriz-caixa-firefox.yml'
  schedule:
    # 09:00–23:55 no horário de Brasília (GitHub cron usa UTC).
    - cron: "*/5 12-23 * * *"
    - cron: "*/5 0-2 * * *"
permissions:
  contents: write
concurrency:
  group: matriz-caixa-lotobanca
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Playwright e Firefox
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install firefox
      - name: Coletar resultado da Caixa pela Lotobanca
        env:
          LOTOBANCA_LOGIN: ${{ secrets.LOTOBANCA_LOGIN }}
          LOTOBANCA_SENHA: ${{ secrets.LOTOBANCA_SENHA }}
        run: python3 caixa/matriz-firefox-remoto.py
      - name: Publicar arquivo Caixa separado
        if: success()
        run: |
          if git diff --quiet -- caixa/resultados.json; then
            echo "Sem resultado novo; arquivo preservado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caixa/resultados.json
          git commit -m "Caixa Lotobanca: atualizar Matriz 8.5"
          git push origin HEAD:main
