name: Matriz Caixa Lotobanca Chromium
on:
  schedule:
    - cron: '0-50/5 * * * *'
    - cron: '55 0-22 * * *'
    - cron: '55 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'caixa/matriz-caixa-chromium.py'
      - '.github/workflows/matriz-caixa-lotobanca.yml'
permissions:
  contents: write
concurrency:
  group: matriz-caixa-lotobanca
  cancel-in-progress: false
jobs:
  coletar-caixa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Instalar Playwright e Chromium
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
      - name: Aguardar e coletar concursos publicados pela Lotobanca
        env:
          CAIXA_JANELA_SEGUNDOS: ${{ github.event.schedule == '55 23 * * *' && '900' || '180' }}
          LOTOBANCA_LOGIN: ${{ secrets.LOTOBANCA_LOGIN }}
          LOTOBANCA_SENHA: ${{ secrets.LOTOBANCA_SENHA }}
        run: python3 caixa/matriz-caixa-chromium.py
      - name: Publicar somente o arquivo separado da Caixa
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caixa/resultados.json
          if git diff --cached --quiet; then
            echo "Sem concursos novos da Caixa; o arquivo separado permanece igual."
            exit 0
          fi
          git commit -m "Caixa Lotobanca: atualizar resultados"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Nao foi possivel publicar caixa/resultados.json"
          exit 1
