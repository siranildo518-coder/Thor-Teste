name: Matriz Turbo - Firefox remoto
on:
  workflow_dispatch:
  schedule:
    - cron: '3-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: matriz-turbo-atualizacao
  cancel-in-progress: false
jobs:
  testar-firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Playwright sem pacotes extras do Ubuntu
        timeout-minutes: 5
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install firefox
      - name: Abrir Lotobanca no Firefox remoto
        timeout-minutes: 11
        env:
          LOTOBANCA_LOGIN: ${{ secrets.LOTOBANCA_LOGIN }}
          LOTOBANCA_SENHA: ${{ secrets.LOTOBANCA_SENHA }}
        run: |
          for tentativa in 1 2; do
            echo "Coleta Matriz 8.5 - tentativa $tentativa/2"
            python3 thor-turbo/matriz-firefox-remoto.py || echo "::warning::Falha na coleta $tentativa"
            if python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          rows = json.loads(Path("thor-turbo/resultados.json").read_text(encoding="utf-8")).get("records", [])
          datas = [r.get("scheduledAt", "") for r in rows]
          latest = max(datas, default="")
          if not latest:
              raise SystemExit(1)
          last = datetime.fromisoformat(latest.replace("Z", "+00:00"))
          now = datetime.now(timezone.utc)
          # Dar 20 minutos para o sorteio horario ficar disponivel na origem.
          expected = now.replace(minute=0, second=0, microsecond=0) - timedelta(minutes=40)
          print("Ultimo sorteio:", latest, "Limite esperado:", expected.isoformat())
          raise SystemExit(0 if last >= expected else 1)
          PY
            then
              echo "Matriz 8.5 dentro da janela de atualizacao."
              break
            fi
            if [ "$tentativa" -eq 1 ]; then
              echo "::warning::Resultado atrasado; nova tentativa em 30 segundos."
              sleep 30
            else
              echo "::warning::Matriz 8.5 ainda atrasada apos duas tentativas. Verifique a origem e os logs."
            fi
          done
      - name: Diagnosticar atraso da Matriz 8.5
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("thor-turbo/resultados.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          rows = data.get("records", [])
          latest = max((r.get("scheduledAt", "") for r in rows), default="")
          print("Registros:", len(rows), "Ultimo sorteio:", latest)
          if latest:
              dt = datetime.fromisoformat(latest.replace("Z", "+00:00"))
              hours = (datetime.now(timezone.utc) - dt).total_seconds() / 3600
              print(f"Atraso do resultado mais recente: {hours:.1f} hora(s)")
              if hours > 2:
                  print("AVISO: a coleta nao publicou concursos recentes. Verifique login, API e logs do Firefox.")
          PY
      - name: Publicar resultados validos no GitHub
        if: success()
        run: |
          if git diff --quiet -- thor-turbo/resultados.json; then
            echo "Sem concursos novos; nenhum commit necessario."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thor-turbo/resultados.json
          git commit -m "Atualizar resultados Turbo automaticamente"
          git push origin HEAD:main
      - name: Guardar captura diagnostica da tela sem login
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tela-lotobanca-sem-login
          path: diagnostico/tela-lotobanca.png
          if-no-files-found: ignore
          retention-days: 1
