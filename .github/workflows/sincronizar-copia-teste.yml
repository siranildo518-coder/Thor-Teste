name: Sincronizar copia de teste

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sincronizar-copia-teste.yml'

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar THOR TESTE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar versao oficial e isolar ambiente
        shell: bash
        run: |
          git clone --depth 1 https://github.com/siranildo518-coder/THOR-LOTERIAS.git /tmp/thor-oficial
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/thor-oficial/ ./
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          common = [
              ('siranildo518-coder/THOR-LOTERIAS', 'siranildo518-coder/Thor-Teste'),
              ("collection('contas_ativadas')", "collection('teste_contas_ativadas')"),
              ("collection('usuarios_login')", "collection('teste_usuarios_login')"),
              ("collection('acesso_navegador')", "collection('teste_acesso_navegador')"),
              ("'tl_", "'thor_teste_"),
              ('"tl_', '"thor_teste_'),
              ("'thor_", "'thor_teste_"),
              ('"thor_', '"thor_teste_'),
              ("'lotofacil_", "'thor_teste_lotofacil_"),
              ('"lotofacil_', '"thor_teste_lotofacil_'),
          ]
          for name in ['app-main.html','app-direct.html','THOR-LOTERIAS.html','home-reference.js',
                       'home-update-fix.js','jogos-salvos-home-thor7.js','resultados-auto-thor4.js',
                       'lotofacil-contingencia-thor7.js','gerador-minimo-87.js']:
              replace(name, common)

          replace('manifest.json', [
              ('"name": "THOR LOTERIAS"', '"name": "THOR TESTE"'),
              ('"short_name": "THOR"', '"short_name": "THOR TESTE"'),
              ('"description": "THOR LOTERIAS"', '"description": "Cópia isolada do THOR LOTERIAS para testes"'),
              ('"start_url": "./index.html?v=2"', '"start_url": "./index.html?v=thor-teste-v155"'),
              ('"orientation": "portrait",', '"orientation": "portrait",\n  "id": "/Thor-Teste/",'),
          ])

          p = Path('sw-core-thor7.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const CACHE_NAME='thor-loterias-thor7-v150-jogos-acoes-fix3';",
                        "const CACHE_PREFIX='thor-teste-';\nconst CACHE_NAME=CACHE_PREFIX+'thor7-v155-isolado';")
          s = s.replace("keys.filter(k=>k!==CACHE_NAME)", "keys.filter(k=>k.startsWith(CACHE_PREFIX)&&k!==CACHE_NAME)")
          p.write_text(s, encoding='utf-8')

          replace('gerenciador-usuarios.html', [
              ('siranildo518-coder/THOR-LOTERIAS', 'siranildo518-coder/Thor-Teste'),
              ("collection('contas_ativadas')", "collection('teste_contas_ativadas')"),
              ("collection('usuarios_login')", "collection('teste_usuarios_login')"),
              ("collection('acesso_navegador')", "collection('teste_acesso_navegador')"),
          ])
          replace('gerenciador-clientes-125.html', [
              ('siranildo518-coder/THOR-LOTERIAS', 'siranildo518-coder/Thor-Teste'),
              ('repositório THOR-LOTERIAS', 'repositório Thor-Teste'),
          ])
          replace('.github/workflows/build-apk.yml', [
              ('Gerar APK THOR LOTERIAS', 'Gerar APK THOR TESTE'),
              ('com/thorloterias/app', 'com/thorloterias/teste'),
              ("com.thorloterias.app", "com.thorloterias.teste"),
              ("versionCode 147", "versionCode 155"),
              ("versionName 'THOR 7 V145'", "versionName 'THOR TESTE V155'"),
              ('android:label="THOR LOTERIAS"', 'android:label="THOR TESTE"'),
              ('titulo.setText("THOR LOTERIAS")', 'titulo.setText("THOR TESTE")'),
              ('github.io/THOR-LOTERIAS/index.html?apk=145', 'github.io/Thor-Teste/index.html?apk=teste-v155'),
              ('THOR-7-V145.apk', 'THOR-TESTE-V155.apk'),
              ('THOR-7-V145-APK', 'THOR-TESTE-V155-APK'),
          ])
          PY

      - name: Publicar somente no THOR TESTE
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Copia ja sincronizada"
          else
            git commit -m "Cria copia completa e isolada do THOR para testes"
            git push origin main
          fi
