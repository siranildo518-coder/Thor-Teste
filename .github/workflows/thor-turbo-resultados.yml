name: Atualizar resultados THOR Turbo
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thor-turbo-resultados
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Lotobanca e validar resultados
        env:
          LOTOBANCA_AUTH_TOKEN: ${{ secrets.LOTOBANCA_AUTH_TOKEN }}
          LOTOBANCA_APP_ID: ${{ secrets.LOTOBANCA_APP_ID }}
          LOTOBANCA_REQUEST_BODY: ${{ secrets.LOTOBANCA_REQUEST_BODY }}
        run: python3 thor-turbo/scripts/atualizar_resultados.py
      - name: Publicar apenas quando houver mudança
        run: |
          if ! git diff --quiet -- thor-turbo/resultados.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add thor-turbo/resultados.json
            git commit -m "THOR Turbo: atualizar resultados"
            git push
          fi
