name: Tor Turbo - sincronizar resultados
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thor-turbo-resultados
  cancel-in-progress: false
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar fonte de resultados autorizada
        env:
          THOR_RESULTS_SOURCE_URL: ${{ secrets.THOR_RESULTS_SOURCE_URL }}
        run: python thor-turbo/sync_actions.py
      - name: Publicar somente se houver novos resultados
        run: |
          if git diff --quiet -- thor-turbo/resultados.json; then
            echo "Nenhum concurso novo"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thor-turbo/resultados.json
          git commit -m "Tor Turbo: novos resultados validados"
          git push
