<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6fa"><title>Matriz Caixa Lotobanca 8.5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6fa;color:#24202a;font:15px Arial,sans-serif}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;z-index:2;padding:13px 15px;font-size:20px;font-weight:bold}.status{margin:12px;padding:12px;border-radius:10px;background:#eee8f6;color:#6041a1}.wrap{max-width:760px;margin:auto;padding:0 12px 20px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.filters button,.refresh{border:1px solid #d5c8e8;border-radius:20px;background:#fff;color:#6041a1;padding:9px 13px;font-weight:bold}.filters button.active,.refresh{background:#7143b4;color:#fff}.card{background:#fff;border-left:5px solid #7143b4;border-radius:11px;margin:14px 0;box-shadow:0 3px 12px #24143c18;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:#f5effb;font-size:17px;font-weight:bold}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;padding:11px 14px;border-block:1px solid #eee;color:#777;font-size:12px}.meta b{display:block;color:#222;font-size:15px;margin-top:5px}.balls{display:flex;flex-wrap:wrap;gap:8px;padding:18px 14px}.ball{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#7442b5;color:#fff;font-weight:bold;box-shadow:0 5px 12px #7442b54a}.none{padding:24px;text-align:center;color:#666;background:#fff;border-radius:10px}.foot{color:#777;text-align:center;font-size:12px;padding:14px}.bar{display:flex;justify-content:center;padding:8px}.refresh{cursor:pointer}@media(max-width:400px){.ball{width:35px;height:35px}.balls{gap:6px}}
</style></head>
<body><header class="top">Matriz Caixa · Lotobanca 8.5</header><main class="wrap"><div id="status" class="status">Carregando a base separada da Caixa…</div><div class="bar"><button class="refresh" id="refresh">Atualizar agora</button></div><nav class="filters" id="filters"></nav><section id="cards"></section><footer class="foot">Fonte: resultados da Caixa publicados pela Lotobanca. Atualização automática do arquivo a cada 60 segundos.</footer></main>
<script>
'use strict';
const DATA='https://raw.githubusercontent.com/siranildo518-coder/Thor-Teste/main/caixa/resultados.json';
const NAMES=['Todas','Lotofácil','Mega-Sena','Quina','Lotomania','Dia de Sorte','Dupla Sena'];
let selected='Todas',busy=false;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateBR(s){const m=String(s||'').match(/^(\d{4})-(\d\d)-(\d\d)$/);return m?m[3]+'/'+m[2]+'/'+m[1]:String(s||'—')}
function draw(r){return '<article class="card"><div class="head">'+esc(r.modalidade)+(r.sorteio===2?' · 2º sorteio':'')+'<span style="font-size:12px;color:#6841a2">CAIXA</span></div><div class="meta"><div>CONCURSO<b>#'+esc(r.concurso)+'</b></div><div>DATA<b>'+esc(dateBR(r.data))+'</b></div><div>HORÁRIO<b>'+esc(r.horario||'—')+'</b></div></div><div class="balls">'+(r.dezenas||[]).map(n=>'<span class="ball">'+esc(String(n).padStart(2,'0'))+'</span>').join('')+'</div></article>'}
async function load(){if(busy)return;busy=true;$('status').textContent='Atualizando resultados da Caixa…';try{const res=await fetch(DATA+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const json=await res.json(),rows=Array.isArray(json.records)?json.records:[];rows.sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.horario||'').localeCompare(a.horario||'')||Number(b.concurso)-Number(a.concurso));const filtered=selected==='Todas'?rows:rows.filter(r=>r.modalidade===selected);$('status').textContent='Base lida '+new Date().toLocaleTimeString('pt-BR')+' · '+rows.length+' resultados disponíveis';$('filters').innerHTML=NAMES.map(n=>'<button class="'+(n===selected?'active':'')+'" data-name="'+esc(n)+'">'+esc(n)+'</button>').join('');$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.name;load()});$('cards').innerHTML=filtered.length?filtered.slice(0,60).map(draw).join(''):'<div class="none">Aguardando o primeiro resultado da Caixa na base do GitHub.</div>'}catch(e){$('status').textContent='Não foi possível ler a base Caixa: '+e.message;$('cards').innerHTML='<div class="none">Confira a conexão e tente novamente.</div>'}finally{busy=false}}
$('refresh').onclick=load;load();setInterval(load,60000);
</script></body></html>
