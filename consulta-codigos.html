<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thor Teste - Consulta de codigos</title><style>body{font:16px Arial;background:#f3efff;margin:0;color:#24113d}main{max-width:650px;margin:auto;padding:16px}h1{background:#51218b;color:white;margin:0;padding:18px;font-size:22px}button,input{padding:12px;border-radius:8px;border:1px solid #aaa;font-size:16px}button{background:#51218b;color:white;font-weight:bold;margin:4px}input{width:90%}.item{background:white;padding:12px;border-radius:9px;margin:8px 0;border:1px solid #d4c6e8}.status{font-weight:bold}</style><h1>Thor Teste - Consultar codigos</h1><main><p>Consulta de registros do Thor Teste e Thor Oficial, somente leitura.</p><button onclick="carregar('Thor-Teste')">Thor Teste</button><button onclick="carregar('THOR-LOTERIAS')">Thor Oficial</button><p><input id="q" placeholder="Pesquisar codigo de 8 caracteres"></p><button onclick="filtrar()">Procurar</button><button onclick="filtrar(true)">Mostrar todos</button><p id="msg"></p><div id="lista"></div></main><script>
let registros=[],origem='Thor-Teste';const el=id=>document.getElementById(id);
async function carregar(repo){origem=repo;el('msg').textContent='Consultando...';try{let r=await fetch('https://raw.githubusercontent.com/siranildo518-coder/'+repo+'/main/cadastros-liberados.json?at='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();registros=j.liberacoes||[];el('msg').textContent=registros.length+' registros encontrados';filtrar()}catch(e){el('msg').textContent='Falha na consulta: '+e.message}}
async function filtrar(todos=false){let q=el('q').value.trim().toUpperCase(),lista=registros;if(q){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(q));let hash=Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');lista=lista.filter(x=>x.hash===hash)}else if(!todos)lista=lista.slice(-30);el('lista').replaceChildren();for(let x of lista.slice().reverse()){let d=document.createElement('div');d.className='item';let situacao=x.ativo===false||x.bloqueado===true?'Bloqueado':Date.parse(x.expiraEm)<Date.now()?'Vencido':'Ativo';let registro=x.registrado===true||x.consumido===true||x.usado===true||x.utilizado===true?'Foi registrado':'Registro nao informado';d.textContent=situacao+' | '+registro+' | Gerado: '+new Date(x.criadoEm).toLocaleString('pt-BR')+' | Validade: '+new Date(x.expiraEm).toLocaleString('pt-BR')+' | Hash: '+String(x.hash||'').slice(0,12)+'...';el('lista').append(d)}el('msg').textContent=lista.length+' registros exibidos em '+origem}
carregar('Thor-Teste');
</script></html>
