<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>Tor Loterias Turbo · Matriz 8.5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#f5e7bd;font:14px Arial,sans-serif}header{position:sticky;top:0;z-index:3;background:linear-gradient(135deg,#f5ce5c,#b77c12,#f7dc81);color:#111;border:2px solid #111;border-bottom:3px solid #d6a72e;padding:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:18px;margin:0;text-align:center}button,a{cursor:pointer}header button{background:#151515;color:#f6d477;border:1px solid #111;border-radius:7px;padding:9px;text-decoration:none;font-weight:bold}main{padding:12px;max-width:850px;margin:auto}.status{background:#211b11;border:1px solid #aa842e;border-radius:9px;padding:11px;line-height:1.5;margin:8px 0 12px}.status.warn{border-color:#db6b45;color:#ffd0bd}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tabs button{border:1px solid #ad8125;border-radius:8px;background:linear-gradient(#36312a,#17120d);color:#f4d787;padding:12px 3px;font-weight:700}.tabs button.active{background:linear-gradient(#ffe392,#b88724);color:#080808}.results{margin-top:14px}.draw{background:linear-gradient(140deg,#29251c,#100e0b);border:1px solid #aa812b;border-radius:12px;margin-bottom:12px;padding:13px}.draw h2{font-size:16px;margin:0 0 5px}.meta{color:#ddbf77;font-size:12px;margin-bottom:10px}.balls{display:flex;flex-wrap:wrap;gap:7px}.ball{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#fdfdfd,#d9d9d9);color:#101010;font-weight:800;font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions button,.actions a{background:#dfb34c;color:#111;border:1px solid #181818;border-radius:9px;padding:12px;font-weight:800;text-decoration:none;flex:1;text-align:center}footer{color:#bba774;text-align:center;font-size:12px;padding:15px} .empty{padding:30px;text-align:center;border:1px solid #6b5226;border-radius:12px} @media(max-width:400px){.ball{width:32px;height:32px;font-size:14px}.tabs button{font-size:12px}h1{font-size:16px}}
</style></head><body><header><button onclick="goBack()">‹ Voltar</button><h1>⚡ TOR LOTERIAS TURBO<br><small>MATRIZ 8.5</small></h1><button id="refresh">Atualizar</button></header>
<main><div id="status" class="status" role="status">Buscando resultados…</div><div id="tabs" class="tabs"></div><div class="actions"><a href="https://turbo.lotobanca.com/loto-turbo/resultados" target="_blank" rel="noopener">Resultados oficiais ↗</a></div><section id="results" class="results"></section></main><footer>Fonte: resultados Turbo sincronizados no GitHub do Tor Teste. Atualização automática a cada 60 segundos, quando a base receber novos concursos.</footer>
<script>
'use strict';
const NAMES=['Lotofácil Turbo','Mega-Sena Turbo','Quina Turbo','Lotomania Turbo','Dia de Sorte Turbo','Dupla Sena Turbo'];
const DATA='./resultados.json';let tab=NAMES[0],records=[],lastStamp='',lastFetch=0;
const $=id=>document.getElementById(id);
function goBack(){if(history.length>1)history.back();else location.href='../';}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function localTime(s){const d=new Date(s);return Number.isNaN(d.getTime())?'':d.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});}
function stamp(r){return r.scheduledAt||((r.data||'')+'T'+(r.horario||'00:00')+':00-03:00');}
function sorted(a,b){return Number(b.concurso)-Number(a.concurso)||String(stamp(b)).localeCompare(String(stamp(a)));}
function render(){
$('tabs').innerHTML=NAMES.map(n=>'<button type="button" data-name="'+safe(n)+'" class="'+(n===tab?'active':'')+'">'+safe(n.replace(' Turbo',''))+'</button>').join('');
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.name;render()});
const found=records.filter(r=>r.modalidade===tab&&Array.isArray(r.dezenas)&&r.dezenas.length).sort(sorted).slice(0,25);
$('results').innerHTML=found.length?found.map(r=>'<article class="draw"><h2>'+safe(r.modalidade)+' · Concurso '+safe(r.concurso)+'</h2><div class="meta">'+safe(r.data||'')+' '+safe(r.horario||'')+'</div><div class="balls">'+r.dezenas.map(n=>'<span class="ball">'+String(Number(n)).padStart(2,'0')+'</span>').join('')+'</div></article>').join(''):'<div class="empty">Nenhum resultado disponível para esta loteria.</div>';
const all=records.slice().sort((a,b)=>String(stamp(b)).localeCompare(String(stamp(a))));const newest=all[0];let stale=true;
if(newest){const dt=new Date(stamp(newest));stale=Number.isNaN(dt.getTime())||Date.now()-dt.getTime()>2*60*60*1000;}
$('status').className='status'+(stale?' warn':'');
$('status').innerHTML='<strong>'+(stale?'⚠️ Base possivelmente atrasada':'Base carregada')+'</strong><div>'+(newest?'Último registro na base: '+safe(newest.modalidade)+' · concurso '+safe(newest.concurso)+' · '+safe(newest.data)+' '+safe(newest.horario):'Ainda não há concursos')+'</div><div>'+records.length+' registros · Consulta: '+new Date(lastFetch).toLocaleTimeString('pt-BR')+'</div>'+(stale?'<div>Os concursos exibidos podem não ser os mais recentes. Confira o site oficial.</div>':'');
}
async function load(){try{const r=await fetch(DATA+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!Array.isArray(j.records))throw Error('Formato de resultados inválido');records=j.records;lastStamp=j.dataExportacao||'';lastFetch=Date.now();render()}catch(e){$('status').className='status warn';$('status').textContent='Não foi possível carregar a base de resultados: '+e.message+'. Confira o site oficial.';if(!records.length)$('results').innerHTML='<div class="empty">Sem dados disponíveis.</div>';}}
$('refresh').onclick=load;load();setInterval(load,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
